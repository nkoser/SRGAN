data_dir : '/views/data-acc/RW/sukin707/superresolution/data'
root_dir : '/views/data-acc/RW/sukin707/superresolution/'

exp_name : 'Real-ESRGAN_UKE_Generator_001'

checkpoint : #'/views/data-acc/RW/sukin707/superresolution/ESRGAN_GEN_UKE_014/netG_epoch_4_900.pth' # if none, then train from scratch

mask_training: False
mask_warm_up : 100

crop_size : 88
upscale_factor : 4 # 2,4,8
num_epochs : 1000
num_channel : 1
gan : 'real-esrgan' # esrgan #real-esrgan
dataset : 'UKE' # VOC2012 # UKE # UKEHR
cache_rate : 1
batch_size : 16 #64

lr_g : 0.0001
lr_d : 0.0001

adv_type : 'vanilla' # LSGAN # RaGAN

# Loss
perceptual_loss : 'radimagenet_resnet50' #'radimagenet_resnet50' # "alex", "vgg", "squeeze", "radimagenet_resnet50" #vgg_loss
perceptual_loss_lib : 'esrgan' #monai

layer_weights:
  # before relu
  'conv1_2': 0.1
  'conv2_2': 0.1
  'conv3_4': 1
  'conv4_4': 1
  'conv5_4': 1

perceptual_weight : 1 #0.006 #0.006 #0.006
adv_weight : 0.1 #0.001 #5e-3 #0.001
mse_weight: 0 #0.01 #1e-2 # for esrgan use mse weight as l1_weight
l1_weight : 1
ssim_weight : 0
tv_weight: 0 #0.00000002 #2e-8
gp_weight : 10

# Warm up things
warm_up : 1000

# Use wandb
wandb : True
run_name : 'run_1'
